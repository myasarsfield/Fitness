<title>Fitness Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first logbook. Sticky header, one scrolling column (max 720px), fixed bottom tab bar, bottom-sheet forms. */
:root {
  --bg: #F2F5F1; --surface: #FFFFFF; --surface-2: #F5F8F4; --ink: #10241A; --muted: #56675B; --line: #DFE6DE;
  --accent: #16823C; --accent-ink: #FFFFFF; --accent-soft: #E1F2E6; --green: #16823C; --brown: #7A4523; --lime: #3FD27E;
  --hero: #0F2C1D; --hero-2: #173F2A; --hero-ink: #FFFFFF; --hero-muted: #B9CFBF; --tile: #163A27;
  --pr: #B87C00; --danger: #B3261E; --good: #16823C;
  --k-strength: #7A4523; --k-cardio: #16823C; --k-food: #B87C00; --k-water: #1F86CC; --k-body: #7447C9;
  --k-sleep: #3F4EA3; --k-steps: #0F7A6C; --k-mood: #BE4169; --k-note: #67708A;
  --shadow: 0 1px 2px rgba(16, 36, 26, .06), 0 6px 18px rgba(16, 36, 26, .06);
  --f-display: "Montserrat", "Segoe UI", Arial, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; --nav-h: 66px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A140E; --surface: #122019; --surface-2: #182A20; --ink: #E7F0E9; --muted: #9DB2A3; --line: #24382C;
  --accent: #45CF78; --accent-ink: #0A140E; --accent-soft: #163824; --green: #45CF78; --brown: #D19A6E; --lime: #4FE08B;
  --hero: #07170E; --hero-2: #0E2618; --hero-ink: #F2F8F3; --hero-muted: #9FB9A7; --tile: #12301F;
  --pr: #F0B53A; --danger: #FF7B72; --good: #45CF78;
  --k-strength: #D19A6E; --k-cardio: #45CF78; --k-food: #F0B53A; --k-water: #5AB6F2; --k-body: #B08CF5;
  --k-sleep: #8E9BF0; --k-steps: #3CC6B6; --k-mood: #F07AA0; --k-note: #A2AABE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A140E; --surface: #122019; --surface-2: #182A20; --ink: #E7F0E9; --muted: #9DB2A3; --line: #24382C;
  --accent: #45CF78; --accent-ink: #0A140E; --accent-soft: #163824; --green: #45CF78; --brown: #D19A6E; --lime: #4FE08B;
  --hero: #07170E; --hero-2: #0E2618; --hero-ink: #F2F8F3; --hero-muted: #9FB9A7; --tile: #12301F;
  --pr: #F0B53A; --danger: #FF7B72; --good: #45CF78;
  --k-strength: #D19A6E; --k-cardio: #45CF78; --k-food: #F0B53A; --k-water: #5AB6F2; --k-body: #B08CF5;
  --k-sleep: #8E9BF0; --k-steps: #3CC6B6; --k-mood: #F07AA0; --k-note: #A2AABE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; white-space: nowrap; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand { color: var(--green); } .mark { width: 34px; height: 34px; flex: none; margin-right: -4px; } .brand span { color: var(--accent); }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; text-align: right; line-height: 1.25; }
.sync i { flex: none; }
@media (max-width: 420px) { .brand { font-size: 19px; } .top-in { gap: 8px; } }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--good); } .sync.local i { background: var(--pr); }

main { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Day switcher */
.day { display: flex; align-items: center; gap: 8px; }
.day-title { flex: 1; min-width: 0; }
.day-title b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.day-title span { font-size: 13px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }

/* Meters */
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meter .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.meter .val { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .val small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar b { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 3px; }
.meter.done .val { color: var(--c); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; display: inline-block; }

/* Quick add */
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--green); }
.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:hover { border-color: var(--muted); }

/* Strip of stats */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.strip > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.strip .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.strip .v small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }
@media (max-width: 480px) { .strip { grid-template-columns: 1fr 1fr; } .strip > div:nth-child(2n) { border-right: 0; } .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* Entries */
.entries { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.entry { display: grid; grid-template-columns: 46px 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.entry:last-child { border-bottom: 0; }
.entry:hover { background: var(--surface-2); }
.entry .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.entry .stripe { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); }
.entry .main { min-width: 0; }
.entry .ti { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry .de { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.entry .side { font-family: var(--f-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.entry .side small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
.tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; }
.tag.pr { background: var(--pr); color: var(--surface); }
.tag.sample { border: 1px dashed var(--muted); color: var(--muted); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.day-head b { font-family: var(--f-display); font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.day-head span { font-size: 12px; color: var(--muted); text-align: right; }

.empty { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty p { margin: 0; max-width: 42ch; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; padding: 10px 14px; border: 1px dashed var(--muted); border-radius: var(--r); font-size: 14px; }

.search { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 13px; font-weight: 600; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.scroll-x { overflow-x: auto; display: flex; gap: 8px; padding-bottom: 2px; }
.scroll-x .chip { flex: none; }

/* Charts */
.chart-card { display: flex; flex-direction: column; gap: 8px; }
.chart-card .h-row b { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart-card .h-row b small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .axis { fill: var(--muted); font-family: var(--f-mono); font-size: 9px; }
svg.chart .goal { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; opacity: .55; }
svg.chart .goal-t { fill: var(--ink); opacity: .7; font-family: var(--f-mono); font-size: 9px; }
svg.chart .end-t { fill: var(--ink); font-family: var(--f-mono); font-size: 10px; font-weight: 500; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .charts { grid-template-columns: 1fr; } }
.chart-empty { height: 120px; display: grid; place-items: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; }

table.pb { width: 100%; border-collapse: collapse; font-size: 14px; }
table.pb th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.pb td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.pb tr:last-child td { border-bottom: 0; }
table.pb td.r, table.pb th.r { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.field textarea { min-height: 72px; resize: vertical; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn.link { border: 0; background: none; padding: 6px 0; color: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.set .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: center; }
.set input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.set button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); }
.set-head { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--line); }
.hint b { color: var(--ink); }
.scale { display: flex; gap: 6px; }
.scale button { flex: 1; padding: 9px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { background: var(--c, var(--accent)); color: var(--surface); border-color: var(--c, var(--accent)); }

.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kind { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 14px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border-top: 3px solid var(--c); }
.kind b { font-family: var(--f-display); font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.kind span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.kind:hover { border-color: var(--c); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.sheet-panel { background: var(--surface); width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-radius: 16px 16px 0 0; border: 1px solid var(--line);
  padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-panel { border-radius: 16px; max-height: 88%; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { margin: 0; font-family: var(--f-display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; flex: 1; }

/* Nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); height: var(--nav-h); align-items: center; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab.add span.plus { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.tab.add span.plus svg { width: 24px; height: 24px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast.pr { background: var(--pr); color: var(--surface); font-weight: 600; }

/* Body page and dashboard */
.lib-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.lib-row:last-child { border-bottom: 0; }
.lib-row .nm { font-weight: 600; }
.lib-row .rx { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.used { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; min-width: 88px; min-height: 40px; }
.used[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--surface); }
.sub-h { padding: 8px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.part { scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); }
.part-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.part-head h3 { margin: 0; font-family: var(--f-display); font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
@media (max-width: 640px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
.dash-card { border-top: 3px solid var(--c); min-width: 0; }
.kv { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.kv > div { display: flex; flex-direction: column; min-width: 0; }
.kv b { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; order: 1; }
.kv small { font-size: 12px; color: var(--muted); order: 2; }
.kv span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; order: 0; }
.kv > div { display: grid; grid-template-columns: auto auto; grid-template-areas: "k k" "v u"; align-items: baseline; column-gap: 3px; }
.kv > div span { grid-area: k; } .kv > div b { grid-area: v; } .kv > div small { grid-area: u; }
.hbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 32px; gap: 8px; align-items: center; font-size: 13px; background: none; border: 0; padding: 4px 0; text-align: left; width: 100%; }
.hbar .bar { height: 10px; } .hbar .num { text-align: right; font-weight: 600; }
.toggle-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.small-ib { width: 36px; height: 36px; }
.toast button { margin-left: 12px; background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
/* Drop-downs */

<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const LOCAL_KEY = 'fitness-logbook-v1';
const DEFAULT_SETTINGS = { kcal: 2200, protein: 140, water: 2500, steps: 10000, sleep: 8, active: 30, targetWeight: '' };
const KINDS = {
  strength: { label: 'Strength', blurb: 'Sets, reps and kg' },
  cardio:   { label: 'Cardio',   blurb: 'Runs, rides, swims' },
  food:     { label: 'Food',     blurb: 'Calories and macros' },
  water:    { label: 'Water',    blurb: 'Millilitres drunk' },
  body:     { label: 'Body',     blurb: 'Weight, body fat, waist' },
  sleep:    { label: 'Sleep',    blurb: 'Hours and quality' },
  steps:    { label: 'Steps',    blurb: 'Daily step count' },
  mood:     { label: 'Mood',     blurb: 'Mood and energy' },
  note:     { label: 'Note',     blurb: 'Anything else' }
};
const KIND_KEYS = Object.keys(KINDS);
const COMMON_EX = ['Back squat','Front squat','Bench press','Incline bench press','Overhead press','Deadlift','Romanian deadlift','Barbell row','Pull-up','Chin-up','Lat pulldown','Seated cable row','Dumbbell bench press','Dumbbell shoulder press','Walking lunge','Leg press','Hip thrust','Leg curl','Leg extension','Bicep curl','Tricep pushdown','Lateral raise','Face pull','Calf raise','Plank'];
const CARDIO = ['Run','Walk','Cycle','Swim','Row','Elliptical','Stair climber','HIIT','Hike','Football','Other'];
const MEALS = ['Breakfast','Lunch','Dinner','Snack'];

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDay = s => { const d = parseDay(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const relDay = s => { const t = todayStr(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; if (s === addDays(t, 1)) return 'Tomorrow'; return niceDay(s); };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmt = (n, dp = 0) => n == null || !Number.isFinite(n) ? '–' : n.toLocaleString('en-GB', { maximumFractionDigits: dp, minimumFractionDigits: 0 });
const kc = k => `var(--k-${k})`;
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const e1rm = (kg, reps) => (kg > 0 && reps > 0) ? (reps === 1 ? kg : kg * (1 + reps / 30)) : 0;
const pace = (min, km) => { if (!(min > 0 && km > 0)) return null; const p = min / km; const m = Math.floor(p); const s = Math.round((p - m) * 60); return s === 60 ? `${m + 1}:00` : `${m}:${pad(s)}`; };
const sum = arr => arr.reduce((a, b) => a + (b || 0), 0);
const avg = arr => { const xs = arr.filter(v => v != null && Number.isFinite(v)); return xs.length ? sum(xs) / xs.length : null; };
const volume = e => sum((e.sets || []).map(s => (s.reps || 0) * (s.kg || 0)));
const bestE1 = e => Math.max(0, ...(e.sets || []).map(s => e1rm(s.kg || 0, s.reps || 0)));
const sortEntries = list => list.slice().sort((a, b) => (a.date === b.date ? (a.time || '').localeCompare(b.time || '') || (a.created || 0) - (b.created || 0) : a.date.localeCompare(b.date)));
const ICON = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- Store: synced (claude db) with local fallback ---------- */
const Store = {
  mode: 'connecting', byId: new Map(), settings: { ...DEFAULT_SETTINGS },
  col: null, pending: {}, queue: {}, settingsQueue: Promise.resolve(), listeners: new Set(),
  list() { return sortEntries(Array.from(this.byId.values())); },
  on(fn) { this.listeners.add(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) { const d = JSON.parse(raw); (d.entries || []).forEach(e => this.byId.set(e.id, e)); this.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) }; }
    } catch (_) {}
  },
  saveLocal() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ entries: Array.from(this.byId.values()), settings: this.settings })); }
    catch (_) { toast('This browser is not saving data. Export a backup from Goals.'); }
  },
  async init() {
    let db = null, user = null, id = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (_) {}
      if (db && user) { try { id = await user.id(); } catch (_) {} }
    }
    if (db && id) {
      this.mode = 'cloud';
      this.col = db.collection('data/users/' + id);
      this.col.onSnapshot(snap => this.applySnapshot(snap), err => {
        this.mode = 'local'; this.loadLocal(); this.emit();
        toast('Sync stopped. Changes now save in this browser only.');
        void err;
      });
    } else {
      this.mode = 'local'; this.loadLocal();
    }
    this.emit();
  },
  applySnapshot(snap) {
    const next = new Map();
    let settings = null;
    snap.docs.forEach(doc => {
      const d = doc.data(); if (!d) return;
      if (doc.id === 'settings') { settings = d; return; }
      if (doc.id[0] !== 'd' || this.pending[d.date]) return;
      (d.entries || []).forEach(e => next.set(e.id, e));
    });
    // keep local copies for days with writes still in flight
    this.byId.forEach(e => { if (this.pending[e.date]) next.set(e.id, e); });
    this.byId = next;
    if (settings && !this.pending.__settings) this.settings = { ...DEFAULT_SETTINGS, ...settings };
    this.emit();
  },
  writeDay(date) {
    if (this.mode !== 'cloud') return;
    this.pending[date] = (this.pending[date] || 0) + 1;
    const run = () => {
      const entries = this.list().filter(e => e.date === date);
      const ref = this.col.doc('d' + date);
      return entries.length ? ref.set({ date, entries }) : ref.delete();
    };
    this.queue[date] = (this.queue[date] || Promise.resolve())
      .then(run)
      .catch(err => saveError(err))
      .finally(() => { this.pending[date]--; if (!this.pending[date]) delete this.pending[date]; });
    return this.queue[date];
  },
  put(entry) {
    this.userAct = true;
    const prev = this.byId.get(entry.id);
    this.byId.set(entry.id, entry);
    if (this.mode === 'cloud') { this.writeDay(entry.date); if (prev && prev.date !== entry.date) this.writeDay(prev.date); }
    else this.saveLocal();
    this.emit();
  },
  putMany(entries) {
    this.userAct = true;
    const days = new Set();
    entries.forEach(e => { this.byId.set(e.id, e); days.add(e.date); });
    if (this.mode === 'cloud') days.forEach(d => this.writeDay(d)); else this.saveLocal();
    this.emit();
  },
  remove(id) {
    const prev = this.byId.get(id); if (!prev) return;
    this.byId.delete(id);
    if (this.mode === 'cloud') this.writeDay(prev.date); else this.saveLocal();
    this.emit();
  },
  removeWhere(pred) {
    const days = new Set();
    Array.from(this.byId.values()).forEach(e => { if (pred(e)) { this.byId.delete(e.id); days.add(e.date); } });
    if (this.mode === 'cloud') days.forEach(d => this.writeDay(d)); else this.saveLocal();
    this.emit();
    return days.size;
  },
  setSettings(patch) {
    this.settings = { ...this.settings, ...patch };
    if (this.mode === 'cloud') {
      this.pending.__settings = (this.pending.__settings || 0) + 1;
      const snapshot = { ...this.settings };

/* ---------- UI state ---------- */
const state = { tab: 'dashboard', open: new Set(), closed: new Set(), day: todayStr(), filter: 'all', q: '', range: 28, exercise: '', dashRange: 7, dashOpen: new Set() };
const validTabs = ['today', 'dashboard', 'breakdown', 'body', 'history', 'progress', 'goals'];
try { const h = location.hash.slice(1); if (validTabs.includes(h)) state.tab = h; } catch (_) {}

/* ---------- Derived data ---------- */
function dayTotals(list) {
  const food = list.filter(e => e.kind === 'food');
  const strength = list.filter(e => e.kind === 'strength');
  const cardio = list.filter(e => e.kind === 'cardio');
  return {
    kcal: sum(food.map(e => e.kcal)) + 0, protein: sum(food.map(e => e.protein)), carbs: sum(food.map(e => e.carbs)), fat: sum(food.map(e => e.fat)),
    burned: sum(cardio.map(e => e.kcal)),
    water: sum(list.filter(e => e.kind === 'water').map(e => e.ml)),
    steps: sum(list.filter(e => e.kind === 'steps').map(e => e.count)),
    sleep: sum(list.filter(e => e.kind === 'sleep').map(e => e.hours)),
    active: sum(cardio.map(e => e.minutes)) + sum(strength.map(e => e.minutes)),
    sets: sum(strength.map(e => (e.sets || []).length)), volume: sum(strength.map(volume)),
    km: sum(cardio.map(e => e.km)), hasFood: food.length > 0, hasSteps: list.some(e => e.kind === 'steps'), hasSleep: list.some(e => e.kind === 'sleep'),

function groupByDay(list) { const m = new Map(); list.forEach(e => { if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); }); return m; }

  const best = {}; const ids = new Set();
  all.filter(e => e.kind === 'strength').forEach(e => {
    const k = (e.exercise || '').trim().toLowerCase(); const b = bestE1(e);
    if (b > 0) { if (best[k] != null && b > best[k] + 1e-9) ids.add(e.id); if (best[k] == null || b > best[k]) best[k] = b; }

}
function streak(byDay) {

  let n = 0; while (byDay.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function latestWeight(all, beforeDay) {

  return null;
}
function lastOfExercise(all, name, excludeId) {

  return null;
}

  all.forEach(e => { if (e.kind === 'strength' && e.id !== excludeId && (e.exercise || '').trim().toLowerCase() === k) { const b = bestE1(e); if (b > 0 && (!best || b > best.v)) best = { v: b, e }; } });

function summary(e) {

      const same = sets.length && sets.every(s => s.reps === sets[0].reps && s.kg === sets[0].kg);
      const detail = !sets.length ? 'No sets' : same ? `${sets.length} × ${sets[0].reps}${sets[0].kg ? ` @ ${fmt(sets[0].kg, 2)} kg` : ''}` : sets.map(s => `${s.reps}${s.kg ? '×' + fmt(s.kg, 2) : ''}`).join(', ') + (sets.some(s => s.kg) ? ' kg' : '');
      const v = volume(e);
      return { title: e.exercise || 'Exercise', detail: detail + (e.notes ? ` · ${e.notes}` : ''), side: v ? fmt(v) : String(sets.length), unit: v ? 'kg vol' : 'sets' };
    }
    case 'cardio': {
      const p = pace(e.minutes, e.km);
      const bits = [e.minutes ? `${fmt(e.minutes)} min` : null, p ? `${p} /km` : null, e.kcal ? `${fmt(e.kcal)} kcal` : null, e.notes || null].filter(Boolean);
      return { title: e.activity || 'Cardio', detail: bits.join(' · ') || '–', side: e.km ? fmt(e.km, 2) : fmt(e.minutes), unit: e.km ? 'km' : 'min' };
    }
    case 'food': {
      const m = [e.protein != null ? `P ${fmt(e.protein)}g` : null, e.carbs != null ? `C ${fmt(e.carbs)}g` : null, e.fat != null ? `F ${fmt(e.fat)}g` : null].filter(Boolean).join(' · ');

    case 'steps': return { title: 'Steps', detail: e.count >= 10000 ? '10k or more' : 'Daily count', side: fmt(e.count), unit: 'steps' };

/* ---------- Charts (inline SVG) ---------- */

  let min = Math.min(...ys), max = Math.max(...ys); if (max - min < 1e-6) { min -= 1; max += 1; }

  const ticks = yTicks(min, max);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = `${d}L${x(pts[pts.length - 1].t).toFixed(1)},${H - PB}L${x(pts[0].t).toFixed(1)},${H - PB}Z`;
  const last = pts[pts.length - 1];
  const gid = 'g' + Math.random().toString(36).slice(2, 8);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${o.color};stop-opacity:.22"/><stop offset="1" style="stop-color:${o.color};stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${PL - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v, o.dp || 0)}</text>`).join('')}
    ${o.target != null ? `<line class="goal" x1="${PL}" x2="${W - PR}" y1="${y(o.target)}" y2="${y(o.target)}"/><text class="goal-t" x="${W - PR}" y="${y(o.target) - 4}" text-anchor="end">target ${fmt(o.target, o.dp || 0)}</text>` : ''}
    <path d="${area}" fill="url(#${gid})" stroke="none"/>
    <path d="${d}" style="fill:none;stroke:${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.y)}" r="2.2" style="fill:${o.color}"/>`).join('') : ''}
    <circle cx="${x(last.t)}" cy="${y(last.y)}" r="4.5" style="fill:var(--surface);stroke:${o.color}" stroke-width="2.2"/>
    <text class="axis" x="${PL}" y="${H - 6}">${esc(o.startLabel)}</text><text class="axis" x="${W - PR}" y="${H - 6}" text-anchor="end">${esc(o.endLabel)}</text>
  </svg>`;
}

  const max = Math.max(...bars.map(b => b.y), o.target || 0) * 1.12 || 1;
  const n = bars.length, plotW = W - PL - PR, slot = plotW / n, bw = Math.max(2, slot * 0.64);
  const y = v => PT + (1 - v / max) * (H - PT - PB);

  const labelEvery = Math.ceil(n / 6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">
    ${ticks.map(v => `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${PL - 6}" y="${y(v) + 3}" text-anchor="end">${v >= 10000 ? fmt(v / 1000) + 'k' : fmt(v, o.dp || 0)}</text>`).join('')}
    ${bars.map((b, i) => { const bx = PL + i * slot + (slot - bw) / 2; const h = (H - PB) - y(b.y); const hit = o.target && b.y >= o.target;
      return `${b.y > 0 ? `<rect x="${bx.toFixed(1)}" y="${y(b.y).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="1.5" style="fill:${o.color}" opacity="${o.target && !hit ? .55 : 1}"><title>${esc(b.title || b.label)}: ${fmt(b.y, o.dp || 0)}</title></rect>` : ''}
      ${(i % labelEvery === 0 || i === n - 1) ? `<text class="axis" x="${(bx + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>` : ''}`; }).join('')}
    ${o.target ? `<line class="goal" x1="${PL}" x2="${W - PR}" y1="${y(o.target)}" y2="${y(o.target)}"/><text class="goal-t" x="${W - PR}" y="${y(o.target) - 4}" text-anchor="end">goal ${o.target >= 10000 ? fmt(o.target / 1000) + 'k' : fmt(o.target, o.dp || 0)}</text>` : ''}
  </svg>`;
}
function buckets(range) {
  const t = todayStr(); const out = [];
  if (range <= 31) {
    for (let i = range - 1; i >= 0; i--) { const d = addDays(t, -i); out.push({ label: String(parseDay(d).getDate()), title: niceDay(d), days: [d] }); }
  } else if (range <= 120) {
    const dow = (parseDay(t).getDay() + 6) % 7; const monday = addDays(t, -dow);
    for (let w = Math.round(range / 7) - 1; w >= 0; w--) { const start = addDays(monday, -7 * w); const sd = parseDay(start);
      out.push({ label: `${sd.getDate()} ${MON[sd.getMonth()]}`, title: 'Week of ' + niceDay(start), days: Array.from({ length: 7 }, (_, i) => addDays(start, i)).filter(d => d <= t) }); }
  } else {
    const now = parseDay(t);
    for (let m = 11; m >= 0; m--) { const first = new Date(now.getFullYear(), now.getMonth() - m, 1); const days = []; const c = new Date(first);
      while (c.getMonth() === first.getMonth() && ymd(c) <= t) { days.push(ymd(c)); c.setDate(c.getDate() + 1); }
      out.push({ label: MON[first.getMonth()], title: `${MON[first.getMonth()]} ${first.getFullYear()}`, days }); }
  }
  return out;
}

}

function foodResults(q) {
  const all = Store.list();
  const recent = []; const seen = new Set();
  for (let i = all.length - 1; i >= 0 && recent.length < 40; i--) { const e = all[i]; if (e.kind !== 'food' || !e.name) continue; const k = foodKey(e); if (seen.has(k)) continue; seen.add(k); recent.push({ name: e.name, portion: e.portion || '', kcal: e.kcal, protein: e.protein, carbs: e.carbs, fat: e.fat, tag: 'Recent' }); }
  const fv = favs().map(f => ({ ...f, tag: 'Favourite' }));
  const db = FOOD_DB.map(f => ({ ...f, tag: '' }));
  const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const match = f => toks.every(tk => (f.name + ' ' + f.portion).toLowerCase().includes(tk));
  const out = []; const used = new Set();
  const push = f => { const k = foodKey(f); if (used.has(k)) return; used.add(k); out.push(f); };
  if (!toks.length) { fv.forEach(push); recent.slice(0, 8).forEach(push); return out.slice(0, 20); }
  fv.filter(match).forEach(push); recent.filter(match).forEach(push); db.filter(match).forEach(push);
  return out.slice(0, 30);
}

function aiError(e) {
  const c = e && e.code;
  if (c === 'cancelled') return 'Stopped.';
  if (c === 'not_granted') return 'Claude was not allowed this time. Use Search or Manual, or try again and allow it.';
  if (c === 'rate_limited') return 'Too many requests just now. Wait a moment and try again.';
  if (c === 'image_rejected' || c === 'images_unavailable') return 'That photo could not be used. Try a clearer or smaller one.';
  if (c === 'refused' || c === 'empty_completion' || c === 'invalid_json') return 'Claude could not work that out. Try describing it differently.';
  if (c === 'sampling_disabled' || c === 'session_expired') return 'Claude is not available right now. Use Search or Manual instead.';
  return 'Something went wrong. Try again.';
}
async function runAI(input, opts) {

  try {

    if (!sheetCtx || sheetCtx.food !== F) return;
    const items = (res && Array.isArray(res.items) ? res.items : []).filter(x => x && typeof x === 'object' && x.name).slice(0, 15);
    F.status = items.length ? `Added ${items.length} ${items.length === 1 ? 'item' : 'items'}. Check them below.` : (res && typeof res.note === 'string' && res.note ? res.note.slice(0, 160) : 'No food found.');
    addToBasket(items, 'ai');
  } catch (e) { if (sheetCtx && sheetCtx.food === F) F.status = aiError(e); }
  finally { if (sheetCtx && sheetCtx.food === F) { F.busy = false; F.ctl = null; renderFoodMode(); } }
}
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file); const max = 1600; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (_) { return file; }
}

function guessPart(name) {

    return `<div class="lib-row"><div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="rx">${esc(x.rx)} · ${esc(x.eq)}${x.why ? ` · ${esc(x.why)}` : ''}</div></div>
      <button class="used" data-used="${esc(key)}" aria-pressed="${on}" aria-label="${on ? 'Used today, tap to remove' : 'Mark as used'}: ${esc(x.name)}">${on ? 'Used ✓' : 'Used'}</button></div>`;
  };
  view.innerHTML = `
  ${hero('Train by body part', 'Pick it. Do it. Tick it.', 'Open a body part, choose an exercise and tap Used. It logs straight into your workouts.',
    `<div class="scroll-x" role="group" aria-label="Jump to body part">${BODY.map(p => `<button class="chip" data-jump="${p.id}">${esc(p.name)}</button>`).join('')}</div>`)}
  ${BODY.map(part => {
    const mine = all.filter(e => (e.kind === 'strength' || e.kind === 'cardio') && partOf(e) === part.id);
    const last = mine[mine.length - 1];
    const week = mine.filter(e => e.date >= wkStart);
    const stat = part.id === 'cardio'
      ? `${week.length} sessions · ${fmt(sum(week.map(e => e.minutes)))} min this week`
      : `${sum(week.map(e => (e.sets || []).length))} sets this week`;
    const recent = mine.slice(-3).reverse();
    const statLine = last ? `Last trained ${esc(['Today', 'Yesterday'].includes(relDay(last.date)) ? relDay(last.date).toLowerCase() : niceDay(last.date))} · ${stat}` : 'Not trained yet';
    const usedN = part.popular.concat(part.best).filter(x => usedToday(libKey(part, x)).length).map(x => x.name).filter((v, i, a) => a.indexOf(v) === i).length;
    return `<div class="part" id="part-${part.id}">` + dd('part-' + part.id, `<div class="sum-main"><div class="part-head"><h3>${esc(part.name)}</h3>${usedN ? `<span class="tag" style="background:var(--green);color:var(--surface)">${usedN} used today</span>` : ''}</div><span class="small muted">${statLine}</span></div>`,
      `<div class="entries">
        <div class="sub-h">Your log</div>
        ${recent.length ? recent.map(e => entryRow(e, prs, true)).join('') : `<div class="lib-row"><span class="muted small">Nothing logged for ${esc(part.name.toLowerCase())} yet.</span></div>`}
        <div class="sub-h">Most popular</div>
        ${part.popular.map(x => row(part, x)).join('')}
        <div class="sub-h">Best for results</div>
        ${part.best.map(x => row(part, x)).join('')}
      </div>`, 'part') + `</div>`;
  }).join('')}
  <p class="small muted" style="margin:0">Used logs the exercise to today with your last sets for it, or a starter prescription. Tap Edit on the message to add your weights.</p>`;
}

function renderBreakdown(all) {

  const t = todayStr(), range = state.dashRange, start = addDays(t, -(range - 1));
  const list = all.filter(e => e.date >= start && e.date <= t);
  const byDay = groupByDay(list);

  };

    strength: () => { const es = list.filter(e => e.kind === 'strength').reverse(); return kv([['Sessions', new Set(es.map(e => e.date)).size], ['Exercises', es.length], ['Sets', sum(es.map(e => (e.sets || []).length))], ['Volume', fmt(sum(es.map(volume))), 'kg']]) + rows('strength', es); },
    cardio: () => { const es = list.filter(e => e.kind === 'cardio').reverse(); return kv([['Sessions', es.length], ['Distance', fmt(sum(es.map(e => e.km)), 1), 'km'], ['Time', fmt(sum(es.map(e => e.minutes))), 'min'], ['Burned', fmt(sum(es.map(e => e.kcal))), 'kcal']]) + rows('cardio', es); },
    bodyparts: () => {

      const max = Math.max(1, ...counts.map(c => c.n));

    },
    nutrition: () => { const fd = totals.filter(T => T.hasFood); const a = k => avg(fd.map(T => T[k]));
      return kv([[per ? 'Calories a day' : 'Calories', fmt(a('kcal')), `/ ${fmt(S2.kcal)}`], [per ? 'Protein a day' : 'Protein', fmt(a('protein')), `/ ${fmt(S2.protein)} g`], ['Carbs', fmt(a('carbs')), 'g'], ['Fat', fmt(a('fat')), 'g']]) + dayBars(T => T.hasFood ? T.kcal : 0, { color: kc('food'), target: S2.kcal, label: 'Calories per day' }); },

    sleep: () => { const es = list.filter(e => e.kind === 'sleep'); return kv([['Average', fmt(avg(totals.filter(T => T.hasSleep).map(T => T.sleep)), 1), 'h'], ['Quality', fmt(avg(es.map(e => e.quality)), 1), '/ 5'], ['Nights', es.length]]) + (range >= 7 ? dayBars(T => T.sleep, { color: kc('sleep'), dp: 1, target: S2.sleep, label: 'Hours slept' }) : rows('sleep', es.slice().reverse())); },
    steps: () => { const st = totals.filter(T => T.hasSteps).map(T => T.steps); return kv([['Average', fmt(avg(st)), 'steps'], ['Best day', fmt(st.length ? Math.max(...st) : null)], ['Goal hit', `${st.filter(v => v >= S2.steps).length}/${range}`, 'days']]) + dayBars(T => T.steps, { color: kc('steps'), target: S2.steps, label: 'Steps per day' }); },
    body: () => { const es = list.filter(e => e.kind === 'body'); const ws = es.filter(e => e.weight != null); const latest = latestWeight(all);
      return kv([['Latest weight', latest ? fmt(latest.weight, 1) : '–', 'kg'], ['Change', ws.length > 1 ? (ws[ws.length - 1].weight - ws[0].weight > 0 ? '+' : '') + fmt(ws[ws.length - 1].weight - ws[0].weight, 1) : '–', 'kg'], ['Check-ins', es.length]]) + rows('body', es.slice().reverse()); },
    mood: () => { const es = list.filter(e => e.kind === 'mood'); return kv([['Mood', fmt(avg(es.map(e => e.mood)), 1), '/ 5'], ['Energy', fmt(avg(es.map(e => e.energy)), 1), '/ 5']]) + rows('mood', es.filter(e => e.note).reverse()); },
    note: () => { const es = list.filter(e => e.kind === 'note').reverse(); return kv([['Notes', es.length]]) + rows('note', es); }

    return kv([['Items', es.length], [per ? 'Calories a day' : 'Calories', fmt(sum(es.map(e => e.kcal)) / (per ? dd : 1)), 'kcal'], ['Protein', fmt(sum(es.map(e => e.protein)) / (per ? dd : 1)), 'g']]) + rows('meal-' + m, es); };
  MEALS.forEach(m => { body['meal-' + m] = meal(m); });

  const visible = dashOrder().filter(id => !hidden.has(id));
  view.innerHTML = `
  ${hero(`Breakdown · ${range === 1 ? 'today' : 'last ' + range + ' days'}`, 'All your sections', 'Open any section for the detail. Choose what shows and in what order with Customise.',
    `<div class="actions"><div class="seg" role="group" aria-label="Period">${[[1, 'Today'], [7, '7 days'], [30, '30 days']].map(([v, l]) => `<button data-dash-range="${v}" aria-pressed="${range === v}">${l}</button>`).join('')}</div>
     <button class="btn" data-act="dash-custom">Customise</button></div>`)}
  ${sampleBanner(all)}
  ${visible.length ? `<section class="dash-grid">${visible.map(id => { const s = DASH_BY_ID[id];
    const html = body[id](); const cut = html.indexOf('<!--more-->'); const head = cut >= 0 ? html.slice(0, cut) : ''; const rest = cut >= 0 ? html.slice(cut + 11) : html;
    return dd('dash-' + id, `<div class="sum-main stack" style="gap:8px"><h2 style="display:flex;align-items:center;gap:8px;color:var(--ink)"><span class="dot"></span>${esc(s.label)}</h2>${head}</div>`,
      rest + `<div class="actions"><span class="spacer"></span><button class="btn link small" data-dash-hide="${id}">Hide this section</button></div>`, 'card dash-card', `--c:${kc(s.kind)}`); }).join('')}</section>`
    : `<section class="card empty"><p>Every section is hidden. Choose what to show.</p><button class="btn primary" data-act="dash-custom">Customise breakdown</button></section>`}`;
}

function readForm(form) {
  const fd = new FormData(form); const g = k => fd.get(k); const kind = sheetCtx.kind;
  const base = { id: sheetCtx.id || uid(), kind, date: g('date') || todayStr(), time: g('time') || '' };
  const prev = sheetCtx.id ? Store.byId.get(sheetCtx.id) : null;
  base.created = prev ? prev.created : Date.now();
  if (prev && prev.sample) base.sample = true;
  if (prev && prev.lib) base.lib = prev.lib;
  if (prev && prev.bodyPart && kind === 'cardio') base.bodyPart = prev.bodyPart;
  const clean = o => { Object.keys(o).forEach(k => { if (o[k] === null || o[k] === '') delete o[k]; }); return o; };
  switch (kind) {
    case 'strength': {
      const sets = $$('#sets .set').map(r => ({ reps: num(r.querySelector('[data-reps]').value), kg: num(r.querySelector('[data-kg]').value) })).filter(s => s.reps != null || s.kg != null).map(s => ({ reps: s.reps || 0, kg: s.kg || 0 }));
      if (!(g('exercise') || '').trim()) return { error: 'Add the exercise name.' };
      if (!sets.length) return { error: 'Add at least one set with reps.' };
      return clean({ ...base, exercise: g('exercise').trim(), bodyPart: g('bodyPart') || '', sets, minutes: num(g('minutes')), notes: (g('notes') || '').trim() });
    }
    case 'cardio': {
      const o = clean({ ...base, activity: g('activity'), minutes: num(g('minutes')), km: num(g('km')), kcal: num(g('kcal')), hr: num(g('hr')), notes: (g('notes') || '').trim() });
      if (o.minutes == null && o.km == null) return { error: 'Add a duration or a distance.' };
      return o;
    }
    case 'food': {
      if (!(g('name') || '').trim()) return { error: 'Add what you ate.' };
      return clean({ ...base, meal: g('meal'), name: g('name').trim(), portion: (g('portion') || '').trim(), kcal: num(g('kcal')), protein: num(g('protein')), carbs: num(g('carbs')), fat: num(g('fat')) });
    }
    case 'water': { const ml = num(g('ml')); if (!(ml > 0)) return { error: 'Add an amount in ml.' }; return { ...base, ml }; }
    case 'body': {
      const o = clean({ ...base, weight: num(g('weight')), bodyfat: num(g('bodyfat')), waist: num(g('waist')), chest: num(g('chest')), hips: num(g('hips')), arm: num(g('arm')) });
      if (['weight', 'bodyfat', 'waist', 'chest', 'hips', 'arm'].every(k => o[k] == null)) return { error: 'Add at least one measurement.' };
      return o;
    }
    case 'sleep': { const hours = num(g('hours')); if (!(hours > 0)) return { error: 'Add how many hours you slept.' }; return clean({ ...base, hours, quality: num(g('quality')) }); }
    case 'steps': { const count = num(g('count')); if (!(count > 0)) return { error: 'Add your step count.' }; return { ...base, count: Math.round(count) }; }
    case 'mood': { const o = clean({ ...base, mood: num(g('mood')), energy: num(g('energy')), note: (g('note') || '').trim() }); if (o.mood == null && o.energy == null && !o.note) return { error: 'Pick a mood or energy level.' }; return o; }
    case 'note': { const text = (g('text') || '').trim(); if (!text) return { error: 'Write something first.' }; return { ...base, text }; }
  }
  return { error: 'Unknown entry type.' };
}

function saveEntry(entry) {
  const isNew = !Store.byId.has(entry.id);
  let wasPR = false;
  if (entry.kind === 'strength') { const b = bestOfExercise(Store.list(), entry.exercise, entry.id); wasPR = b && bestE1(entry) > b.v + 1e-9; }
  Store.put(entry);
  if (wasPR) toast(`New best on ${entry.exercise}: est. 1RM ${fmt(bestE1(entry), 1)} kg`, 'pr');
  else toast(isNew ? `${KINDS[entry.kind].label} logged` : 'Changes saved');
}

/* ---------- Sample data ---------- */
function sampleEntries() {
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const out = []; const t = todayStr(); let w = 83.4; let n = 0;
  const mk = (d, kind, time, f) => out.push({ id: `s${d.replace(/-/g, '')}${pad(n++)}`, kind, date: d, time, created: Date.now() + n, sample: true, ...f });
  const foods = {
    Breakfast: [['Porridge with banana and honey', 420, 14, 74, 9], ['Scrambled eggs on toast', 480, 28, 38, 22], ['Greek yoghurt, berries and granola', 390, 26, 48, 10]],
    Lunch: [['Chicken salad wrap', 560, 42, 52, 18], ['Tuna jacket potato', 610, 40, 78, 12], ['Turkey and avocado sandwich', 590, 36, 55, 22]],
    Dinner: [['Salmon, rice and greens', 720, 46, 70, 24], ['Chilli con carne with rice', 780, 48, 84, 22], ['Chicken stir fry with noodles', 690, 50, 72, 18]],
    Snack: [['Protein shake', 180, 30, 8, 3], ['Apple and peanut butter', 260, 7, 28, 14]]
  };
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i); const dow = parseDay(d).getDay(); const wk = Math.floor((13 - i) / 7);
    if (i % 2 === 0 || i <= 1) { w -= 0.16 + rnd() * 0.12; mk(d, 'body', '07:05', i === 13 || i === 6 || i === 0 ? { weight: +w.toFixed(1), bodyfat: +(20.4 - (13 - i) * 0.06).toFixed(1), waist: +(88 - (13 - i) * 0.08).toFixed(1) } : { weight: +w.toFixed(1) }); }
    mk(d, 'sleep', '07:00', { hours: +(6.3 + rnd() * 1.9).toFixed(1), quality: 2 + Math.round(rnd() * 3) });
    const pick = arr => arr[Math.floor(rnd() * arr.length)];
    [['Breakfast', '07:40'], ['Lunch', '12:45'], ['Dinner', '19:10']].forEach(([m, tm]) => { const f = pick(foods[m]); mk(d, 'food', tm, { meal: m, name: f[0], kcal: f[1], protein: f[2], carbs: f[3], fat: f[4] }); });
    if (rnd() > 0.35) { const f = pick(foods.Snack); mk(d, 'food', '16:00', { meal: 'Snack', name: f[0], kcal: f[1], protein: f[2], carbs: f[3], fat: f[4] }); }
    ['08:30', '13:00', '17:30'].forEach(tm => mk(d, 'water', tm, { ml: 500 }));
    if (rnd() > 0.4) mk(d, 'water', '20:00', { ml: 250 });
    mk(d, 'steps', '21:30', { count: Math.round(5800 + rnd() * 7200) });
    const lift = (name, reps, kg, sets = 3) => mk(d, 'strength', '18:00', { exercise: name, sets: Array.from({ length: sets }, () => ({ reps, kg })) });
    if (dow === 1) { lift('Back squat', 5, 90 + wk * 2.5); lift('Bench press', 5, 70 + wk * 2.5); lift('Barbell row', 8, 60); }
    if (dow === 3) { lift('Deadlift', 5, 120 + wk * 5, 2); lift('Overhead press', 6, 45 + wk * 1.25); lift('Pull-up', 8, 0); }
    if (dow === 5) { lift('Back squat', 5, 92.5 + wk * 2.5); lift('Bench press', 5, 72.5 + wk * 2.5); lift('Romanian deadlift', 8, 80); }
    if (dow === 2 || dow === 6) { const km = +(dow === 6 ? 8 + rnd() * 2 : 5 + rnd()).toFixed(2); mk(d, 'cardio', dow === 6 ? '09:00' : '07:00', { activity: 'Run', km, minutes: Math.round(km * (5.4 + rnd() * 0.5)), kcal: Math.round(km * 68) }); }
    if (dow === 0) mk(d, 'cardio', '11:00', { activity: 'Cycle', km: 24, minutes: 70, kcal: 610 });
    mk(d, 'mood', '21:45', { mood: 3 + Math.round(rnd() * 2), energy: 2 + Math.round(rnd() * 3) });
  }
  mk(addDays(t, -10), 'note', '20:00', { text: 'Started a new 5×5 block. Adding 2.5 kg a week to squat and bench.' });
  return out.filter(e => e.date <= t);
}

/* ---------- Export / import ---------- */
async function offerFile(filename, text) {
  let dl = null;
  if (window.claude && typeof window.claude.use === 'function') { try { dl = await window.claude.use('downloads'); } catch (_) {} }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Backup saved'); return; }
    catch (err) { if (err && err.code === 'declined') return; if (err && err.code === 'rate_limited') { toast('A save prompt is already open.'); return; } }
  } else if (!window.claude) {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return; } catch (_) {}
  }
  const box = $('#export-box'); if (box) { box.hidden = false; $('#export-text').value = text; }
}
function toCSV(all) {
  const cols = ['date', 'time', 'kind', 'title', 'detail', 'exercise', 'sets', 'activity', 'minutes', 'km', 'kcal', 'protein', 'carbs', 'fat', 'ml', 'weight', 'bodyfat', 'waist', 'hours', 'quality', 'count', 'mood', 'energy', 'notes'];
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [cols.join(',')].concat(all.map(e => { const s = summary(e); const row = { ...e, title: s.title, detail: s.detail, sets: e.sets ? e.sets.map(x => `${x.reps}x${x.kg}`).join(' ') : '', notes: e.notes || e.note || e.text || '' }; return cols.map(c => q(row[c])).join(','); })).join('\n');
}
function importJSON(text) {
  let d; try { d = JSON.parse(text); } catch (_) { toast('That file is not a valid backup.'); return; }
  const entries = (Array.isArray(d) ? d : d.entries || []).filter(e => e && typeof e === 'object' && KINDS[e.kind] && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '') && typeof e.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(e.id));
  const fresh = entries.filter(e => !Store.byId.has(e.id));
  if (!entries.length) { toast('No entries found in that file.'); return; }
  Store.putMany(fresh);

  toast(`Imported ${fresh.length} new ${fresh.length === 1 ? 'entry' : 'entries'}${entries.length > fresh.length ? ` (${entries.length - fresh.length} already here)` : ''}`);
}

        runAI(`Estimate the nutrition of each food in this description of what someone ate. Split it into separate items and use typical UK portion sizes where amounts are not given. ${AI_FORMAT}\n\nDescription: ${JSON.stringify(d.slice(0, 1500))}`, { modelTier: 'quick' }); return; }
      case 'ai-photo': { if (!F.photo) return; const hint = ($('#f-fq-hint') ? $('#f-fq-hint').value : '').trim().slice(0, 300); F.hint = hint;
        const prompt = F.photoKind === 'label'
          ? `This photo shows a food packaging nutrition label. Use the product name if it is visible. Read the per-serving values, or per 100 g if no serving is given, and say which in portion. ${hint ? `The person says they had: "${hint}". Scale the values to that amount and describe it in portion.` : 'Return one serving.'} ${AI_FORMAT}`
          : `This photo shows food someone ate. Identify each separate food, estimate its portion from the photo and estimate its nutrition.${hint ? ` The person adds: "${hint}".` : ''} ${AI_FORMAT}`;
        runAI(prompt, { images: [F.photo] }); return; }
      case 'ai-stop': if (F.ctl) F.ctl.abort(); return;
      case 'food-log': logBasket(); return;
      case 'meal-save': $('#save-meal-box').hidden = false; $('#f-mealname').focus(); return;
      case 'meal-save-cancel': $('#save-meal-box').hidden = true; return;
      case 'meal-save-confirm': { const name = ($('#f-mealname').value || '').trim(); if (!name) { toast('Give the meal a name.'); return; }
        const m = { id: 'm' + uid(), name: name.slice(0, 40), meal: $('#f-meal').value, items: F.basket.map(b => { const v = bkVals(b); return { name: b.name, portion: b.qty === 1 ? b.portion : `${fmt(b.qty, 1)} × ${b.portion || 'portion'}`, ...v }; }) };
        Store.setSettings({ meals: [m].concat(meals()).slice(0, 30) }); $('#save-meal-box').hidden = true; toast(`Saved "${m.name}". Find it under Saved and on Today.`); return; }
    }
  }
  if (el.dataset.jump) { state.open.add('part-' + el.dataset.jump); const dt = document.querySelector(`[data-dd="part-${el.dataset.jump}"]`); if (dt) dt.open = true; const sec = document.getElementById('part-' + el.dataset.jump); if (sec) sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  if (el.dataset.tileToggle) { const ids = tileIds(); const id = el.dataset.tileToggle; const i = ids.indexOf(id);
    if (i >= 0) { if (ids.length === 1) { toast('Keep at least one tile.'); return; } ids.splice(i, 1); } else { if (ids.length >= TILE_MAX) { toast(`You can show up to ${TILE_MAX} tiles. Remove one first.`); return; } ids.push(id); }
    Store.setSettings({ tiles: ids }); openTilePicker(); return; }
  if (el.dataset.dashRange) { state.dashRange = Number(el.dataset.dashRange); render(); return; }
  if (el.dataset.dashMore) { const id = el.dataset.dashMore; state.dashOpen.has(id) ? state.dashOpen.delete(id) : state.dashOpen.add(id); render(); return; }
  if (el.dataset.dashHide) { const h = dashHidden(); h.add(el.dataset.dashHide); Store.setSettings({ dashHidden: Array.from(h) }); toast('Section hidden. Bring it back from Customise.'); return; }
  if (el.dataset.dashToggle) { const h = dashHidden(); const id = el.dataset.dashToggle; h.has(id) ? h.delete(id) : h.add(id); Store.setSettings({ dashHidden: Array.from(h) }); openDashCustom(); return; }
  if (el.dataset.dashMove) { const o = dashOrder(); const i = o.indexOf(el.dataset.dashMove); const j = i + Number(el.dataset.dir); if (j >= 0 && j < o.length) { [o[i], o[j]] = [o[j], o[i]]; Store.setSettings({ dash: o }); } openDashCustom(); return; }
  if (el.dataset.new) { openForm(el.dataset.new); return; }
  if (el.dataset.edit) { const e = Store.byId.get(el.dataset.edit); if (e) openForm(e.kind, e); return; }
  if (el.dataset.quickWater) { Store.put({ id: uid(), kind: 'water', date: state.day, time: state.day === todayStr() ? nowTime() : '12:00', created: Date.now(), ml: Number(el.dataset.quickWater) }); toast(`+${el.dataset.quickWater} ml water`); return; }
  if (el.dataset.filter) { state.filter = el.dataset.filter; $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === state.filter)); renderHistoryList(); return; }
  if (el.dataset.range) { state.range = Number(el.dataset.range); render(); return; }
  if (el.dataset.setMl) { $('#f-ml').value = el.dataset.setMl; return; }
  if (el.closest('[data-scale]')) { const sc = el.closest('[data-scale]'); const inp = sc.parentElement.querySelector('input[type=hidden]'); const v = el.dataset.v; const on = inp.value !== v; inp.value = on ? v : ''; $$('button', sc).forEach(b => b.setAttribute('aria-pressed', on && b.dataset.v === v)); return; }
  switch (el.dataset.act) {
    case 'add': openPicker(); break;
    case 'dash-custom': openDashCustom(); break;
    case 'tiles-edit': openTilePicker(); break;
    case 'tiles-reset': Store.setSettings({ tiles: DEFAULT_TILES.slice() }); openTilePicker(); break;
    case 'dash-all': Store.setSettings({ dashHidden: [] }); openDashCustom(); break;
    case 'close': closeSheet(); break;
    case 'day-prev': state.day = addDays(state.day, -1); render(); break;
    case 'day-next': if (state.day < todayStr()) { state.day = addDays(state.day, 1); render(); } break;
    case 'day-today': state.day = todayStr(); render(); break;
    case 'add-set': { const rows = $$('#sets .set'); const last = rows[rows.length - 1]; addSetRow(last ? { reps: last.querySelector('[data-reps]').value, kg: last.querySelector('[data-kg]').value } : {}); break; }
    case 'del-set': { el.closest('.set').remove(); if (!$$('#sets .set').length) addSetRow(); renumberSets(); break; }
    case 'copy-last': { const last = lastOfExercise(Store.list(), $('#f-exercise').value, sheetCtx && sheetCtx.id); if (last) { $('#sets').innerHTML = ''; last.sets.forEach(s => addSetRow(s)); } break; }
    case 'delete': if (armed(el, 'Tap again to delete')) { const id = sheetCtx.id; closeSheet(); Store.remove(id); toast('Entry deleted'); } break;
    case 'load-sample': Store.putMany(sampleEntries()); toast('Sample fortnight loaded'); break;
    case 'clear-sample': Store.removeWhere(e => e.sample); toast('Sample data removed'); break;
    case 'clear-all': if (armed(el, 'Tap again to delete everything')) { Store.removeWhere(() => true); toast('All entries deleted'); } break;
    case 'export': offerFile(`fitness-logbook-${todayStr()}.json`, JSON.stringify({ app: 'fitness-logbook', version: 1, exported: new Date().toISOString(), settings: Store.settings, entries: Store.list() }, null, 2)); break;
    case 'export-csv': offerFile(`fitness-logbook-${todayStr()}.csv`, toCSV(Store.list())); break;
    case 'copy-export': { const ta = $('#export-text'); const done = () => toast('Copied'); try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast('Press copy to finish'); }); } catch (_) { ta.select(); } break; }
  }
});
sheet.addEventListener('click', ev => { if (ev.target === sheet) closeSheet(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !sheet.hidden) closeSheet(); });

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'entry-form') return;
  ev.preventDefault();
  const res = readForm(ev.target);
  const err = $('#form-err');
  if (res.error) { err.textContent = res.error; err.hidden = false; return; }
  closeSheet(); saveEntry(res);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'hist-q') { state.q = t.value; renderHistoryList(); return; }
  if (sheetCtx && sheetCtx.food) {
    const F = sheetCtx.food;
    if (t.id === 'fq-q') { F.q = t.value; renderFoodResults(); return; }
    if (t.id === 'fq-desc') { F.desc = t.value; return; }
    if (t.id === 'f-fq-hint') { F.hint = t.value; return; }
    if (t.dataset.bkField) { const b = F.basket.find(x => x.key === t.closest('[data-bk]').dataset.bk); const v = num(t.value); if (b) { b.base[t.dataset.bkField] = v == null ? 0 : Math.max(0, v) / b.qty; updateBasketTotal(); } return; }
  }
  if (t.id === 'f-exercise') updateExHint();
  if (t.id === 'f-minutes' || t.id === 'f-km') updatePace();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.goal) { const k = t.dataset.goal; const v = num(t.value); Store.setSettings({ [k]: k === 'targetWeight' ? (v == null ? '' : v) : (v == null ? DEFAULT_SETTINGS[k] : v) }); toast('Goal saved'); return; }
  if (t.id === 'ex-pick') { state.exercise = t.value; render(); return; }
  if (t.id === 'f-name') {
    const k = t.value.trim().toLowerCase(); const prev = Store.list().filter(e => e.kind === 'food' && (e.name || '').toLowerCase() === k).pop();
    if (prev) ['kcal', 'protein', 'carbs', 'fat'].forEach(f => { const inp = $('#f-' + f); if (inp && inp.value === '' && prev[f] != null) inp.value = prev[f]; });
    return;
  }
  if (t.id === 'f-exercise') {
    const last = lastOfExercise(Store.list(), t.value, sheetCtx && sheetCtx.id);
    const rows = $$('#sets .set'); const blank = rows.every(r => !r.querySelector('[data-reps]').value && !r.querySelector('[data-kg]').value);
    if (last && blank) { $('#sets').innerHTML = ''; last.sets.forEach(s => addSetRow(s)); }
    const bp = $('#f-bodyPart'); if (bp && !bp.value) bp.value = (last && last.bodyPart) || guessPart(t.value);
    return;
  }
  if (t.id === 'fq-file' && t.files && t.files[0] && sheetCtx && sheetCtx.food) { const F = sheetCtx.food; const file = t.files[0];
    F.status = 'Preparing photo…'; renderFoodMode(); shrinkImage(file).then(blob => { if (!sheetCtx || sheetCtx.food !== F) return; if (F.photoUrl) URL.revokeObjectURL(F.photoUrl); F.photo = blob; F.photoUrl = URL.createObjectURL(blob); F.status = ''; renderFoodMode(); }); return; }
  if (t.id === 'import-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importJSON(String(r.result)); r.readAsText(t.files[0]); t.value = ''; }
});

Store.on(render);
Store.on(checkCelebrate);
render();
Store.init();
// roll the day over at midnight if the page stays open on today
let lastToday = todayStr();
setInterval(() => { const t = todayStr(); if (t !== lastToday) { if (state.day === lastToday) state.day = t; lastToday = t; render(); } }, 60000);
})();
</script>
